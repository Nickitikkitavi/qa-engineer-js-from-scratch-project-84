---
- summary: |
    Успешная фильтрация производителя товаров
  requirement: |
    При выборе фильтров пользователь должен видеть товары, которые соответсвуют заданным фильтрам
  prerequisites: |
    Открыта главная страница магазина
  steps:
    - Нажать на фильтр "Dior" в блоке "Производитель"
  expected-result: |
    На странице должны отображаться только товары бренда "Dior"

- summary: |
    Успешная фильтрация цены товаров
  requirement: |
    При выборе ценового диапазона пользоватль должен видеть товары, которые соответсвуют заданным фильтрам
  prerequisites: |
    Открыта главная страница магазина
  steps:
    - в блоке цена в поле "от" ввести "100"
  expected-result: |
    На странице должны отображаться только товары с ценой от 100
	
- summary: |
    Проверка входа пользователя с несуществующими логином и паролем
  requirement: |
    При неправильном логине или пароле пользователь должен получить сообщение об ошибке
  prerequisites:
    Открыта страница логина
  test-data: |
    Логин = Логин = hexlet Пароль = badpass
  steps:
    - Вводим логин
    - Вводим пароль
    - Нажимаем кнопку «Войти»
  expected-result: |
    Пользователь должен попасть на главную страницу
